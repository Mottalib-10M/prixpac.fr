name: Prix de l'énergie et des CEE, mise à jour quotidienne et déploiement

# Chaque matin : relevé des prix publics (scripts/update-data.mjs) — prix moyens CEE du registre Emmy,
# tarif réglementé Base 9 kVA (CRE, data.gouv.fr), prix du gaz des ménages (Eurostat nrg_pc_202),
# fioul de chauffage (Weekly Oil Bulletin de la Commission européenne) —, tests, build, publication
# GitHub Pages ; params-2026.json et la date du relevé sont recommités s'ils ont changé.
# Une source qui échoue garde sa valeur de la veille ; un test raté bloque la publication.
# Aucune clé d'API : données publiques.
on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Relevé des prix (Emmy, CRE, Eurostat, Weekly Oil Bulletin)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/update-data.mjs
      - name: Tests du moteur et des pages
        run: npx vitest run
      - name: Build (avec contrôle des snippets)
        run: npm run build
      - name: Recommit des données si elles ont changé
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "releve-prix-pac"
          git config user.email "releve-prix-pac@users.noreply.github.com"
          git add src/data/params-2026.json src/data/pac/fichier.json
          if ! git diff --cached --quiet; then
            git commit -m "Prix de l'énergie et des CEE : relevé du $(date -u +%F)" && git push || echo "push refusé, relevé gardé pour le prochain passage"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (script IndexNow)
        uses: actions/checkout@v4
      - name: Ping IndexNow
        continue-on-error: true
        run: bash scripts/indexnow.sh
